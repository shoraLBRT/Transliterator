<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Транслитерация Корана кириллицей по правилам таджвида — прямо в браузере." />
    <!-- Цвет полосы браузера — фон страницы своей темы (D12), как --cream в app.css. -->
    <meta name="theme-color" content="#fbf7ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141a19" media="(prefers-color-scheme: dark)" />
    <title>Транслитерация Корана</title>
    <base href="/" />
    <!-- Значок вкладки (D13) — знак из шапки; SVG сам меняет цвета под тёмную тему. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- ?v= — первые 8 знаков SHA-256 файла (переводы строк как LF). Браузер не берёт
         из кеша прежний page.js или app.css к новой сборке: файл изменился — изменился
         и адрес. Сверяет PageAssetVersionTests и подсказывает новое значение. -->
    <link rel="stylesheet" href="css/app.css?v=0efcb456" />
</head>

<body>
    <div id="app">
        <!-- Экран загрузки (D22) — скелет той же страницы: те же классы каркаса, что
             у App.razor (шапка, подсказка, поле, кнопки сбоку), поэтому поле стоит
             там же, где встанет настоящее, и подмена его не сдвигает. Blazor
             заменяет всё содержимое #app при старте. Полосу и проценты ведёт
             --blazor-load-percentage, которую Blazor ставит на <html>; диктору —
             aria-valuenow, его обновляет page.js. -->
        <div class="shell boot" aria-busy="true">
            <div class="boot-progress" role="progressbar" aria-labelledby="boot-loading"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="boot-progress-bar"></span>
            </div>

            <div class="topbar" aria-hidden="true">
                <div class="topbar-brand">
                    <svg class="topbar-mark" viewBox="5 5 22 22">
                        <path d="M6.5 8.5C6.5 18 10.5 23.5 16 23.5C21.5 23.5 25.5 18.5 25.5 11C24.2 17.1 20.8 20.7 16 20.7C11.2 20.7 7.6 16.1 6.5 8.5Z" />
                        <circle cx="16" cy="11" r="2.2" />
                    </svg>
                    <span class="topbar-name" data-shell="heading">Транслитерация Корана</span>
                </div>
                <span class="boot-block boot-language"></span>
            </div>

            <div class="stage">
                <p class="hint" aria-hidden="true">
                    <span class="boot-hint"><span class="boot-block"></span><span class="boot-block"></span></span>
                </p>

                <div class="composer" aria-hidden="true">
                    <div class="composer-input"><span class="boot-block boot-text"></span></div>
                    <div class="composer-bar">
                        <span class="picker-toggle boot-toggle"><span class="boot-block boot-icon"></span><span class="boot-block boot-label"></span></span>
                    </div>
                </div>

                <div class="quick-start-body">
                    <div class="quick-start-chips" aria-hidden="true">
                        <span class="boot-block boot-label"></span>
                        <span class="picker-toggle boot-chip">&nbsp;</span>
                        <span class="picker-toggle boot-chip">&nbsp;</span>
                        <span class="picker-toggle boot-chip">&nbsp;</span>
                    </div>
                    <p class="quick-start-note boot-status" role="status">
                        <span id="boot-loading" data-shell="loading">Загрузка…</span><span class="boot-percent"></span>
                    </p>
                </div>

                <div class="side-rail" aria-hidden="true">
                    <span class="picker-toggle"><svg viewBox="0 0 24 24"></svg><span class="picker-toggle-text boot-block boot-label"></span></span>
                    <span class="picker-toggle"><svg viewBox="0 0 24 24"></svg><span class="picker-toggle-text boot-block boot-label"></span></span>
                    <span class="picker-toggle"><svg viewBox="0 0 24 24"></svg><span class="picker-toggle-text boot-block boot-label"></span></span>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span data-shell="error">Произошла непредвиденная ошибка.</span>
        <a href="" class="reload" data-shell="reload">Перезагрузить</a>
    </div>

    <script src="js/page.js?v=bd3e42d0"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
