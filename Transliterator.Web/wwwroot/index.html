<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Транслитерация Корана кириллицей по правилам таджвида — прямо в браузере." />
    <!-- Цвет полосы браузера — фон страницы своей темы (D12), как --cream в app.css. -->
    <meta name="theme-color" content="#fbf7ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141a19" media="(prefers-color-scheme: dark)" />
    <title>Транслитерация Корана</title>
    <base href="/" />
    <!-- Значок вкладки (D13) — знак из шапки; SVG сам меняет цвета под тёмную тему. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- ?v= — первые 8 знаков SHA-256 файла (переводы строк как LF). Браузер не берёт
         из кеша прежний page.js или app.css к новой сборке: файл изменился — изменился
         и адрес. Сверяет PageAssetVersionTests и подсказывает новое значение. -->
    <link rel="stylesheet" href="css/app.css?v=b5c7968a" />
</head>

<body>
    <div id="app">
        <div class="boot" role="status">
            <span class="boot-dot" aria-hidden="true"></span>
            <span data-shell="loading">Загрузка…</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span data-shell="error">Произошла непредвиденная ошибка.</span>
        <a href="" class="reload" data-shell="reload">Перезагрузить</a>
    </div>

    <script src="js/page.js?v=60ffc350"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
