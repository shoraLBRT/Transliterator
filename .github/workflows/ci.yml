# Сборка и тесты на каждый PR в master (F1).
#
# Правило «чекбокс и код в одном PR» держится на том, что тесты запущены.
# Прогон корпуса (A4) — часть Transliterator.Tests и идёт в этом же запуске:
# корпус, не доехавший до вывода сборки, роняет CorpusLoaderTests, а не
# превращается в зелёный прогон ни на чём.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Transliterator.sln

      # Собирается всё решение, включая веб-версию: CA1416 в ядре и в Transliterator.Web
      # — ошибка сборки, и обращение к API, которого нет в браузере, должно ронять PR.
      - name: Build
        run: dotnet build Transliterator.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Transliterator.sln
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # Упавший тест виден в PR красной проверкой и в журнале шага Test;
      # полный отчёт — артефактом, чтобы не искать падение в прокрутке.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
