name: Commit messages

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  english:
    name: English commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The PR title is checked too: GitHub puts it into the merge commit message.
      - name: Check PR title and commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          check=.github/scripts/check-commit-message.pl
          msg=$(mktemp)
          status=0

          printf '%s\n' "$PR_TITLE" > "$msg"
          perl "$check" "$msg" "PR title" || status=1

          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$msg"
            perl "$check" "$msg" "commit $(git log -1 --format='%h' "$sha")" || status=1
          done

          exit $status
